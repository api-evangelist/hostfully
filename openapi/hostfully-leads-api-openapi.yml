openapi: 3.2.0
info:
  title: Hostfully Leads API
  license:
    name: Apache 2.0
    url: https://www.hostfully.com/
  version: v3.0.1
servers:
- url: https://sandbox-api.hostfully.com
security:
- JWT-Authentication: []
- Agency-API-key: []
tags:
- name: Leads
paths:
  /api/v3.3/leads:
    get:
      tags:
      - Leads
      summary: Search leads with filters
      description: One of 'propertyUid', 'agencyUid', 'leadUids' parameters is required. Endpoint will return only those leads which the api client is authorized to access.
      operationId: findLeads
      parameters:
      - name: propertyUid
        in: query
        required: false
        schema:
          type: string
      - name: agencyUid
        in: query
        required: false
        schema:
          type: string
      - name: leadUids
        in: query
        description: List of uids. Usage '?leadUids=A,B,C' or '?leadUids=A&leadUids=B&leadUids=C'
        required: false
        schema:
          uniqueItems: true
          type: array
          items:
            type: string
      - name: checkInFrom
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: checkInTo
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: checkOutFrom
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: checkOutTo
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: checkInFromUtcDateTime
        in: query
        required: false
        schema:
          type: string
          example: '2026-04-20T11:52:36'
      - name: checkInToUtcDateTime
        in: query
        required: false
        schema:
          type: string
          example: '2026-04-20T11:52:36'
      - name: checkOutFromUtcDateTime
        in: query
        required: false
        schema:
          type: string
          example: '2026-04-20T11:52:36'
      - name: checkOutToUtcDateTime
        in: query
        required: false
        schema:
          type: string
          example: '2026-04-20T11:52:36'
      - name: updatedSince
        in: query
        required: false
        schema:
          type: string
          example: '2026-04-20T11:52:36'
      - name: _limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: _cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LeadApi3ListOfResourcesResponseLeadApiV3_1Dto'
    post:
      tags:
      - Leads
      summary: Create a new lead
      description: Creates given lead in the system. For further lead workflow interactions, please use resource actions available under POST .../leads/{uid}/{action} .Api client creating lead will have access to that lead's personal and confidential information.
      operationId: createLead
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadApiV3_1CreationDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LeadApi3SingleResourceResponseLeadApiV3_1Dto'
  /api/v3.3/leads/group-booking:
    get:
      tags:
      - Leads
      summary: Get group-booking by 'groupUid'
      description: The complete group-booking of given groupUid structure will be returned, including main lead and its sub-leads. Endpoint will only return if the api client is authorized to access the main lead.
      operationId: findGroupBookingLeads
      parameters:
      - name: propertyUid
        in: query
        required: false
        schema:
          type: string
      - name: leadUids
        in: query
        required: false
        schema:
          uniqueItems: true
          type: array
          items:
            type: string
      - name: checkInFrom
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: checkInTo
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: checkOutFrom
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: checkOutTo
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: updatedSince
        in: query
        required: false
        schema:
          type: string
          example: '2026-04-20T11:52:36'
      - name: _limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: _cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LeadApi3ListOfResourcesResponseLeadApiV3GroupBookingDto'
  /api/v3.3/leads/group-booking/{groupUid}:
    get:
      tags:
      - Leads
      summary: Get group-booking by 'groupUid'
      description: The complete group-booking of given groupUid structure will be returned, including main lead and its sub-leads. Endpoint will only return if the api client is authorized to access the main lead.
      operationId: getGroupBooking
      parameters:
      - name: groupUid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LeadApi3SingleResourceResponseLeadApiV3GroupBookingDto'
  /api/v3.3/leads/{leadUid}:
    get:
      tags:
      - Leads
      summary: Retrieve a lead by UID
      description: Fetches a single lead by its unique identifier.
      operationId: findLead
      parameters:
      - name: leadUid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LeadApi3SingleResourceResponseLeadApiV3_1Dto'
    delete:
      tags:
      - Leads
      summary: Delete obsolete lead
      description: Deleting of the lead can only be done if the lead is of proper status depending on its type. Block can always be deleted. Inquiry can only be deleted if it's been closed, ignored or rejected. Booking requests be deleted if they were not accepted, meaning if they were not turned into a booking. Booking can only be deleted if it has been cancelled.
      operationId: removeLead
      parameters:
      - name: leadUid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
    patch:
      tags:
      - Leads
      summary: Partially update lead information
      description: This call can only update CRUD-type of lead information. It cannot update anything related to lead workflow. This call will only allow for editing personal data if the api client is partner with access to lead's personal data. Otherwise, personal data fields will be ignored.
      operationId: patchLead
      parameters:
      - name: leadUid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadApiV3PatchDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LeadApi3SingleResourceResponseLeadApiV3_1Dto'
  /api/v3.3/leads/{leadUid}/accept-booking-request:
    post:
      tags:
      - Leads
      summary: Accept booking request
      description: Accepts the booking request
      operationId: acceptBookingRequest
      parameters:
      - name: leadUid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LeadApi3SingleResourceResponseLeadApiV3_1Dto'
  /api/v3.3/leads/{leadUid}/alteration:
    post:
      tags:
      - Leads
      summary: Alter lead details
      description: Allows for changing lead's property, dates or guest data. Successful alteration will result in order recalculation.
      operationId: changeDates
      parameters:
      - name: leadUid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadApiV3_1AlterationRequestDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LeadApi3SingleResourceResponseLeadApiV3_1Dto'
  /api/v3.3/leads/{leadUid}/cancel:
    post:
      tags:
      - Leads
      summary: Cancel booking
      description: Cancels the booking
      operationId: cancel
      parameters:
      - name: leadUid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LeadApi3SingleResourceResponseLeadApiV3_1Dto'
  /api/v3.3/leads/{leadUid}/close:
    post:
      tags:
      - Leads
      summary: Close lead
      description: Closes the lead.
      operationId: close
      parameters:
      - name: leadUid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LeadApi3SingleResourceResponseLeadApiV3_1Dto'
  /api/v3.3/leads/{leadUid}/decline-booking-request:
    post:
      tags:
      - Leads
      summary: Decline booking request
      description: Declines the booking request
      operationId: declineBookingRequest
      parameters:
      - name: leadUid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LeadApi3SingleResourceResponseLeadApiV3_1Dto'
  /api/v3.3/leads/{leadUid}/extend-hold:
    post:
      tags:
      - Leads
      summary: Extend hold duration
      description: Extends the hold to 24h ahead. 24h is the default value. It can be changed in agency's settings
      operationId: extendHold
      parameters:
      - name: leadUid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LeadApi3SingleResourceResponseLeadApiV3_1Dto'
  /api/v3.3/leads/{leadUid}/ignore:
    post:
      tags:
      - Leads
      summary: Mark lead as ignored
      description: Marks the lead as ignored
      operationId: ignore
      parameters:
      - name: leadUid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LeadApi3SingleResourceResponseLeadApiV3_1Dto'
  /api/v3.3/leads/{leadUid}/mark-as-booked:
    post:
      tags:
      - Leads
      summary: Transform inquiry to booking
      description: Transforms the inquiry to a booking
      operationId: markAsBooked
      parameters:
      - name: leadUid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LeadApi3SingleResourceResponseLeadApiV3_1Dto'
  /api/v3.3/leads/{leadUid}/mark-paf-completed:
    post:
      tags:
      - Leads
      summary: Mark pre-arrival form completed
      description: Pre arrival form is a form that is filled in by guest upon Property Manager request with details about the stay, such as exact arrival/departure times, rental agreement signatures and populating custom-data fields.
      operationId: markPreArrivalFormCompleted
      parameters:
      - name: leadUid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LeadApi3SingleResourceResponseLeadApiV3_1Dto'
  /api/v3.3/leads/{leadUid}/put-on-hold:
    post:
      tags:
      - Leads
      summary: Place inquiry on hold
      description: Places an inquiry on hold. The holds lasts 24h by default, but can be changed in agency's settings
      operationId: putLeadOnHold
      parameters:
      - name: leadUid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LeadApi3SingleResourceResponseLeadApiV3_1Dto'
  /api/v3.3/leads/{leadUid}/rebook:
    post:
      tags:
      - Leads
      summary: Rebook cancelled booking
      description: Rebooks cancelled booking
      operationId: rebook
      parameters:
      - name: leadUid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LeadApi3SingleResourceResponseLeadApiV3_1Dto'
  /api/v3.3/leads/{leadUid}/reopen:
    post:
      tags:
      - Leads
      summary: Reopen inquiry
      description: Reopens the inquiry
      operationId: reopen
      parameters:
      - name: leadUid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LeadApi3SingleResourceResponseLeadApiV3_1Dto'
  /api/v3.3/leads/{leadUid}/set-rental-conditions:
    post:
      tags:
      - Leads
      summary: Update rental agreement URL
      description: Allows the rental agreement URL to be update for lead directly
      operationId: updateRentalAgreementUrl
      parameters:
      - name: leadUid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadApiV3RentalConditionsDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LeadApi3SingleResourceResponseLeadApiV3_1Dto'
components:
  schemas:
    LeadApiV3GroupBookingSubLeadDto:
      type: object
      properties:
        uid:
          type: string
          description: Identifier generated for each lead. In UID format
        groupUid:
          type: string
          description: Identifier in UID format for indexing the group-booking, uses UID of the main lead
        propertyUid:
          type: string
          description: UID of UNIT when master/sub. UID of the UNIT_TYPE when hotel
        agencyUid:
          type: string
        unitUid:
          type: string
          description: Identifier of the chosen Unit (SUB UNIT UID for master/sub properties, and UNIT for hotels). UID format
        checkInZonedDateTime:
          type: string
          description: Check in datetime with the timezone offset
          format: date-time
        checkOutZonedDateTime:
          type: string
          description: Check out datetime with the timezone offset
          format: date-time
        checkInLocalDateTime:
          type: string
          example: '2026-04-20T11:52:36'
        checkOutLocalDateTime:
          type: string
          example: '2026-04-20T11:52:36'
        externalBookingId:
          type: string
        notes:
          type: string
          description: Replaced with 'HIDDEN' if api caller has no access to see lead's personal and confidential information
        extraNotes:
          type: string
          description: Replaced with 'HIDDEN' if api caller has no access to see lead's personal and confidential information
        assignee:
          $ref: '#/components/schemas/LeadApiV3AssigneeDto'
        guestInformation:
          $ref: '#/components/schemas/LeadGuestInformationForCreationApiV3Dto'
      description: Returns the reservation data of the sub-lead, along with its respective groupUid
    LeadApiV3PatchDto:
      type: object
      properties:
        guestInformation:
          $ref: '#/components/schemas/LeadGuestInformationForPatchApiV3Dto'
        notes:
          type: string
        extraNotes:
          type: string
    QuoteOverridesApi3Dto:
      type: object
      properties:
        rent:
          $ref: '#/components/schemas/QuoteRentOverridesApi3Dto'
        securityDeposit:
          type: number
        fees:
          $ref: '#/components/schemas/QuoteFeesOverridesApi3Dto'
        totalPrice:
          type: number
        force100PercentPaymentAtReservation:
          type: boolean
    QuoteFeesOverridesApi3Dto:
      type: object
      properties:
        cleaningFee:
          $ref: '#/components/schemas/PriceOverridesApi3Dto'
        otherFees:
          type: array
          items:
            $ref: '#/components/schemas/QuoteFeeOverridesApi3Dto'
    LeadApiV3RentalConditionsDto:
      required:
      - rentalConditionsUrl
      type: object
      properties:
        rentalConditionsUrl:
          type: string
    LeadApi3ListOfResourcesResponseLeadApiV3GroupBookingDto:
      type: object
      properties:
        leads:
          type: array
          items:
            $ref: '#/components/schemas/LeadApiV3GroupBookingDto'
        _metadata:
          $ref: '#/components/schemas/Api3ResponseMetadata'
        _paging:
          $ref: '#/components/schemas/Api3ResponsePaging'
    LeadApiV3GroupBookingDto:
      type: object
      properties:
        uid:
          type: string
        propertyUid:
          type: string
        agencyUid:
          type: string
        checkInZonedDateTime:
          type: string
          description: Check in datetime with the timezone offset
          format: date-time
        checkOutZonedDateTime:
          type: string
          description: Check out datetime with the timezone offset
          format: date-time
        checkInLocalDateTime:
          type: string
          example: '2026-04-20T11:52:36'
        checkOutLocalDateTime:
          type: string
          example: '2026-04-20T11:52:36'
        status:
          type: string
          enum:
          - BLOCKED
          - NEW
          - ON_HOLD
          - CLOSED
          - PENDING
          - PENDING_APPROVED
          - DECLINED
          - BOOKED
          - CANCELLED
          - IGNORED
          - DUPLICATE
          - SAMPLE
        type:
          type: string
          enum:
          - INQUIRY
          - BOOKING_REQUEST
          - BLOCK
          - BOOKING
        source:
          type: string
          enum:
          - HOSTFULLY_UI
          - HOSTFULLY_DBS
          - HOSTFULLY_API
          - HOSTFULLY_LINKED
          - HOSTFULLY_OWNER_PORTAL
          - HOSTFULLY_ICAL
          - DIRECT_HOMETOGO
          - DIRECT_BOOKINGDOTCOM
          - DIRECT_AIRBNB
          - DIRECT_VRBO
          - DIRECT_HVMI
          - DIRECT_REDAWNING
          - DIRECT_GOOGLE
        channel:
          type: string
          description: Represents the list of known channels in Lead API V3. This enum may be extended with additional values in API versions.API Clients must gracefully handle unmapped or unexpected entries with fallback or defaulting strategy to ensure safe behavior
          enum:
          - HOSTFULLY
          - AIRBNB
          - BOOKING_COM
          - VRBO
          - HVMB
          - GOOGLE
          - FIND_RENTALS
          - FLATAWAY
          - GOLIGHTLY
          - HOMADS
          - TRIP_ADVISOR
          - VACAYMYMAY
          - STAYMENTITY
          - GETAWAYGOGO
          - EVERYSTAY
          - REDAWNING
          - MISTERBNB
          - WHIMSTAY
          - KOPA
          - OWNERDIRECT
          - B0ARDING
          - TRAVELSTAYTION
          - BNBFINDER
          - LODGELOVERS
          - LAKE
          - MINISTAYS
          - TRAMONA
          - NEXTPAX
          - RENTALS_UNITED
          - HOUFY
          - VRASIO
          - STAYNEARN
          - BLUEGROUND
          - ANYSTAY
          - STAY
          - CREWDOGS
        bookedUtcDateTime:
          type: string
          example: '2026-04-20T11:52:36'
        externalBookingId:
          type: string
        notes:
          type: string
          description: Replaced with 'HIDDEN' if api caller has no access to see lead's personal and confidential information
        extraNotes:
          type: string
          description: Replaced with 'HIDDEN' if api caller has no access to see lead's personal and confidential information
        assignee:
          $ref: '#/components/schemas/LeadApiV3AssigneeDto'
        metadata:
          $ref: '#/components/schemas/LeadMetadataApiV3Dto'
        guestInformation:
          $ref: '#/components/schemas/LeadGuestInformationForCreationApiV3Dto'
        referrer:
          type: string
        mainLeadUid:
          type: string
        groupUid:
          type: string
        hotelUid:
          type: string
          description: Returned in case property is Multi-Unit (Hotel), ignored for master/sub properties
        subLeads:
          type: array
          items:
            $ref: '#/components/schemas/LeadApiV3GroupBookingSubLeadDto'
    PriceOverridesApi3Dto:
      required:
      - netPrice
      type: object
      properties:
        netPrice:
          type: number
        taxationRate:
          type: number
    LeadMetadataApiV3Dto:
      type: object
      properties:
        createdUtcDateTime:
          type: string
          example: '2026-04-20T11:52:36'
        updatedUtcDateTime:
          type: string
          example: '2026-04-20T11:52:36'
        creationCircumstances:
          type: string
          description: Optional type defining what process created the lead.
          enum:
          - IMPORTED_FROM_CSV
          - CREATED_WHILE_CHANNEL_ON
          - IMPORTED_UPON_CHANNEL_CONNECTION
    Api3ResponseMetadata:
      type: object
      properties:
        count:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int32
    LeadApi3SingleResourceResponseLeadApiV3_1Dto:
      type: object
      properties:
        lead:
          $ref: '#/components/schemas/LeadApiV3_1Dto'
    LeadApiV3_1AlterationRequestDto:
      type: object
      properties:
        checkInLocalDateTime:
          type: string
          example: '2026-04-20T11:52:36'
        checkOutLocalDateTime:
          type: string
          example: '2026-04-20T11:52:36'
        checkInLocalDate:
          type: string
          description: Check in date. Will apply property's default check in time. For specifying different time, use checkInLocalDateTime.
          format: date
        checkOutLocalDate:
          type: string
          description: Check in date. Will apply property's default check in time. For specifying different time, use checkInLocalDateTime.
          format: date
        propertyUid:
          type: string
          description: New property to change the lead to. Lead must meet property requirements and property availability.
        adultCount:
          minimum: 1
          type: integer
          format: int32
        childrenCount:
          minimum: 0
          type: integer
          format: int32
        petCount:
          minimum: 0
          type: integer
          format: int32
        infantCount:
          minimum: 0
          type: integer
          format: int32
        quoteOverrides:
          $ref: '#/components/schemas/QuoteOverridesApi3Dto'
        unitUid:
          type: string
          description: New unit to change the lead to. Unit must meet availability and turnover requirements.
    LeadGuestInformationForPatchApiV3Dto:
      type: object
      properties:
        firstName:
          type: string
          description: Replaced with 'HIDDEN' if api caller has no access to see lead's personal and confidential information
        lastName:
          type: string
          description: Replaced with 'HIDDEN' if api caller has no access to see lead's personal and confidential information
        address1:
          type: string
          description: Replaced with 'HIDDEN' if api caller has no access to see lead's personal and confidential information
        address2:
          type: string
          description: Replaced with 'HIDDEN' if api caller has no access to see lead's personal and confidential information
        zipCode:
          type: string
          description: Replaced with 'HIDDEN' if api caller has no access to see lead's personal and confidential information
        city:
          type: string
          description: Replaced with 'HIDDEN' if api caller has no access to see lead's personal and confidential information
        state:
          type: string
          description: Replaced with 'HIDDEN' if api caller has no access to see lead's personal and confidential information
        countryCode:
          type: string
          description: Replaced with null if api caller has no access to see lead's personal and confidential information
          enum:
          - AF
          - AL
          - DZ
          - AS
          - AD
          - AO
          - AI
          - AG
          - AN
          - AR
          - AM
          - AW
          - AU
          - AT
          - AZ
          - BS
          - BH
          - BD
          - BB
          - BY
          - BE
          - BZ
          - BJ
          - BM
          - BT
          - BO
          - BA
          - BW
          - BR
          - BN
          - BG
          - BF
          - BI
          - BQ
          - KH
          - CM
          - CA
