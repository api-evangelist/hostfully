servers:
- url: https://sandbox-api.hostfully.com
security:
- JWT-Authentication: []
- Agency-API-key: []
tags:
- name: Unit types
paths:
  /api/v3.3/multi-units/unit-types:
    get:
      tags:
      - Unit types
      summary: List unit types
      description: Retrieves paginated unit types for a hotel with optional updatedSince filter
      operationId: findByHotelUid
      parameters:
      - name: hotelUid
        in: query
        required: true
        schema:
          type: string
      - name: _cursor
        in: query
        required: false
        schema:
          type: string
      - name: _limit
        in: query
        required: false
        schema:
          minimum: 0
          type: integer
          format: int32
      - name: updatedSince
        in: query
        required: false
        schema:
          type: string
          example: '2024-09-28T10:31:01'
        example: '2024-09-28T10:31:01'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UnitTypeApi3_1PaginatedResultWrapper'
  /api/v3.3/multi-units/unit-types/{unitTypeUid}:
    get:
      tags:
      - Unit types
      summary: Get unit type details
      description: Retrieves details of a specific unit type
      operationId: findByPropertyUid_4
      parameters:
      - name: unitTypeUid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UnitTypeApi3_1SingleResultWrapper'
    delete:
      tags:
      - Unit types
      summary: Delete unit type
      description: Removes a unit type from the system
      operationId: deletePropertyByUid_1
      parameters:
      - name: unitTypeUid
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
    patch:
      tags:
      - Unit types
      summary: Update unit type
      description: Provides ability to partially update unit type resource. Not all fields need to be present
      operationId: updatePropertyPartially_1
      parameters:
      - name: unitTypeUid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitTypeApi3_1UpdateRequestDto'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UnitTypeApi3_1SingleResultWrapper'
