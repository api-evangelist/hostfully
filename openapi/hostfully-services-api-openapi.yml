openapi: 3.2.0
info:
  title: Hostfully Services API
  license:
    name: Apache 2.0
    url: https://www.hostfully.com/
  version: v3.0.1
servers:
- url: https://sandbox-api.hostfully.com
security:
- JWT-Authentication: []
- Agency-API-key: []
tags:
- name: Services
paths:
  /api/v3.3/services:
    get:
      tags:
      - Services
      summary: List services
      description: Retrieves services filtered by agency, service provider or type
      operationId: getAll_1
      parameters:
      - name: agencyUid
        in: query
        required: false
        schema:
          type: string
      - name: serviceProviderUid
        in: query
        required: false
        schema:
          type: string
      - name: cateredTo
        in: query
        required: false
        schema:
          type: string
          enum:
          - GUEST
          - HOST
          - BOTH
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ServicesApiResponseWrapper'
    post:
      tags:
      - Services
      summary: Create service
      description: Adds a new service to the system
      operationId: post_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceAddingApi3Dto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ServiceApiResponseWrapper'
  /api/v3.3/services/{serviceUid}:
    get:
      tags:
      - Services
      summary: Get service details
      description: Retrieves complete details of a specific service
      operationId: getOne
      parameters:
      - name: serviceUid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ServiceApiResponseWrapper'
    put:
      tags:
      - Services
      summary: Update service
      description: Modifies all details of an existing service
      operationId: put
      parameters:
      - name: serviceUid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceUpdatingApi3Dto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ServiceApiResponseWrapper'
