openapi: 3.2.0
info:
  title: Hostfully Sub Units API
  license:
    name: Apache 2.0
    url: https://www.hostfully.com/
  version: v3.0.1
servers:
- url: https://sandbox-api.hostfully.com
security:
- JWT-Authentication: []
- Agency-API-key: []
tags:
- name: Sub Units
paths:
  /api/v3.3/sub-units/{agencyUid}:
    get:
      tags:
      - Sub Units
      summary: Get the sub-units for an Agency
      operationId: getAll
      parameters:
      - name: agencyUid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SubUnitsApi3ResponseWrapper'
components:
  schemas:
    SubUnitsApi3ResponseWrapper:
      type: object
      properties:
        subUnits:
          type: array
          items:
            $ref: '#/components/schemas/SubUnitsApi3ResponseDto'
        _metadata:
          $ref: '#/components/schemas/Api3ResponseMetadata'
    Api3ResponseMetadata:
      type: object
      properties:
        count:
          type: integer
          format: int32
        totalCount:
          type: integer
          format: int32
    SubUnitsApi3ResponseDto:
      type: object
      properties:
        uid:
          type: string
        bookable:
          type: boolean
        subUnits:
          uniqueItems: true
          type: array
          items:
            type: string
  securitySchemes:
    JWT-Authentication:
      type: apiKey
      description: OAuth Access Token
      name: Authorization
      in: header
    Agency-API-key:
      type: apiKey
      description: API Key
      name: X-HOSTFULLY-APIKEY
      in: header
externalDocs:
  description: Hostfully Documentation
  url: https://dev.hostfully.com/v3.0/reference
x-readme:
  explorer-enabled: true
  proxy-enabled: true
