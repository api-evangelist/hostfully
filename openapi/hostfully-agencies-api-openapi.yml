openapi: 3.2.0
info:
  title: Hostfully Agencies API
  license:
    name: Apache 2.0
    url: https://www.hostfully.com/
  version: v3.0.1
servers:
- url: https://sandbox-api.hostfully.com
security:
- JWT-Authentication: []
- Agency-API-key: []
tags:
- name: Agencies
paths:
  /api/v3.3/agencies/{uid}:
    get:
      tags:
      - Agencies
      summary: Get an agency by UID
      description: Returns the agency details for the given UID, only if the API client is authorized to access it.
      operationId: getAgency
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AgencyApiV3ResponseWrapper'
  /api/v3.3/agencies:
    get:
      tags:
      - Agencies
      summary: Get agencies
      description: Returns the list of agencies the API client is authorized to access.
      operationId: getAgencies
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AgenciesApiV3ResponseWrapper'
