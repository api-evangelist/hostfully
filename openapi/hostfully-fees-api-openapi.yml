openapi: 3.2.0
info:
  title: Hostfully Fees API
  license:
    name: Apache 2.0
    url: https://www.hostfully.com/
  version: v3.0.1
servers:
- url: https://sandbox-api.hostfully.com
security:
- JWT-Authentication: []
- Agency-API-key: []
tags:
- name: Fees
paths:
  /api/v3.3/fees/{uid}:
    get:
      tags:
      - Fees
      summary: Get fee by UID
      description: Retrieve details of a fee identified by its UIDwith all fee configuration fields.
      operationId: findByUid_3
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FeeApi3_3ResponseWrapper'
    put:
      tags:
      - Fees
      summary: Update an existing fee
      description: Update the fee identified by UID with the given fee data.
      operationId: updateFee
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeeSavingApi3_3Dto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FeeApi3_3ResponseWrapper'
    delete:
      tags:
      - Fees
      summary: Delete a fee
      description: Delete the fee identified by the given UID.
      operationId: deleteFee
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
  /api/v3.3/fees:
    get:
      tags:
      - Fees
      summary: Get all property fees
      description: Retrieve all fees associated with the specified property UID with all fee configuration fields.
      operationId: findAll_8
      parameters:
      - name: propertyUid
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FeeApi3_3ResponseListWrapper'
    post:
      tags:
      - Fees
      summary: Create a new fee
      description: Create a fee for a property using the provided fee data.
      operationId: createFee
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeeSavingApi3_3Dto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FeeApi3_3ResponseWrapper'
