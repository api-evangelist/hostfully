openapi: 3.2.0
info:
  title: Hostfully Owners API
  license:
    name: Apache 2.0
    url: https://www.hostfully.com/
  version: v3.0.1
servers:
- url: https://sandbox-api.hostfully.com
security:
- JWT-Authentication: []
- Agency-API-key: []
tags:
- name: Owners
paths:
  /api/v3.3/owners/{ownerUid}:
    get:
      tags:
      - Owners
      summary: Get owner details
      description: Retrieves detailed information about a specific owner by their UID
      operationId: getOne_6
      parameters:
      - name: ownerUid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OwnerApiResponseWrapper'
    delete:
      tags:
      - Owners
      summary: Remove owner from agency
      description: Remove owner from agency.
      operationId: delete_8
      parameters:
      - name: ownerUid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
    patch:
      tags:
      - Owners
      summary: Update owner information
      description: Partially updates owner details using JSON merge patch semantics
      operationId: patch_2
      parameters:
      - name: ownerUid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerUpdatingApi3Dto'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OwnerApiResponseWrapper'
  /api/v3.3/owners:
    get:
      tags:
      - Owners
      summary: List owners by agency
      description: Retrieves all owners for a specific agency with optional search query filtering
      operationId: getAll_8
      parameters:
      - name: agencyUid
        in: query
        required: true
        schema:
          type: string
      - name: query
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OwnersApiResponseWrapper'
