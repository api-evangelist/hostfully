tags:
- name: Multi-Unit Properties
paths:
  /api/v3.3/multi-units/multi-unit-properties:
    get:
      tags:
      - Multi-Unit Properties
      summary: List multi-unit properties by agency
      description: Retrieves paginated list of multi-unit properties for a specific agency with optional filtering by update date
      operationId: findHotelsByAgencyUid
      parameters:
      - name: agencyUid
        in: query
        required: true
        schema:
          type: string
      - name: _cursor
        in: query
        description: Cursor for pagination
        required: false
        schema:
          type: string
          description: Cursor for pagination
      - name: _limit
        in: query
        description: Limit for pagination
        required: false
        schema:
          type: string
          description: Limit for pagination
      - name: updatedSince
        in: query
        required: false
        schema:
          type: string
          example: '2024-09-28T10:31:01'
        example: '2024-09-28T10:31:01'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/HotelApi3_1PaginatedListWrapper'
    post:
      tags:
      - Multi-Unit Properties
      summary: Create new multi-unit property
      description: Creates a new multi-unit property record for the specified agency
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotelCreationRequestApi3_1Dto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/HotelApi3_1SingleResourceWrapper'
  /api/v3.3/multi-units/multi-unit-properties/{uid}:
    get:
      tags:
      - Multi-Unit Properties
      summary: Get multi-unit property by UID
      description: Retrieves a single multi-unit property by its unique identifier
      operationId: findByUid_4
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/HotelApi3_1SingleResourceWrapper'
    delete:
      tags:
      - Multi-Unit Properties
      summary: Delete multi-unit property
      description: Removes a multi-unit property record from the system
      operationId: deleteByUid
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
    patch:
      tags:
      - Multi-Unit Properties
      summary: Update multi-unit property
      description: Partially updates an existing multi-unit property using JSON merge patch semantics
      operationId: patch_3
      parameters:
      - name: uid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotelUpdateRequestApi3_1Dto'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/HotelApi3_1SingleResourceWrapper'
