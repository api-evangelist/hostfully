          enum:
          - PER_NIGHT
          - PER_STAY
          - PER_GUEST_PER_NIGHT
          - PER_GUEST
          - PER_PET
          - PER_PET_PER_NIGHT
          - PERCENTAGE_OF_TOTAL
          - PERCENTAGE_OF_RENT
        type:
          type: string
          enum:
          - CLEANING
          - EARLY_ARRIVAL
          - LATE_DEPARTURE
          - PET
          - TAX
          - CUSTOM
        isOptional:
          type: boolean
        netPrice:
          type: number
        enabled:
          type: boolean
        removed:
