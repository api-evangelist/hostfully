openapi: 3.2.0
info:
  title: Hostfully Leads Test Endpoint API
  license:
    name: Apache 2.0
    url: https://www.hostfully.com/
  version: v3.0.1
servers:
- url: https://sandbox-api.hostfully.com
security:
- JWT-Authentication: []
- Agency-API-key: []
tags:
- name: Leads Test Endpoint
paths:
  /api/v3.3/leads-test/group-booking:
    post:
      tags:
      - Leads Test Endpoint
      summary: Create a new group booking lead
      description: Creates given group booking lead in the system. Api client creating lead will have access to that lead's personal and confidential information.
      operationId: createGroupBookingLead
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadApiV3GroupBookingCreationDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LeadApiV3GroupBookingDto'
  /api/v3.3/leads-test/group-booking/{groupUid}/cancel:
    post:
      tags:
      - Leads Test Endpoint
      summary: Cancel group-booking by 'groupUid'
      description: Cancellation of the entire group booking. The main lead and all the sub leads.
      operationId: cancelGroupBooking
      parameters:
      - name: groupUid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
