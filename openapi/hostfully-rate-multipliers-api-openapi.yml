openapi: 3.2.0
info:
  title: Hostfully Rate Multipliers API
  license:
    name: Apache 2.0
    url: https://www.hostfully.com/
  version: v3.0.1
servers:
- url: https://sandbox-api.hostfully.com
security:
- JWT-Authentication: []
- Agency-API-key: []
tags:
- name: Rate Multipliers
paths:
  /api/v3.3/rate-multipliers:
    get:
      tags:
      - Rate Multipliers
      summary: Get rate multipliers for active channels
      operationId: findAll_2
      parameters:
      - name: agencyUid
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RateMultipliersApiResponseWrapper'
    patch:
      tags:
      - Rate Multipliers
      summary: Update rate multipliers for active channels.
      operationId: updateRateMultipliers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateMultipliersApi3Dto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RateMultipliersApiResponseWrapper'
components:
  schemas:
    RateMultipliersApiResponseWrapper:
      type: object
      properties:
        rateMultipliers:
          $ref: '#/components/schemas/RateMultipliersApi3Dto'
    RateMultiplierApi3Dto:
      required:
      - value
      type: object
      properties:
        value:
          minimum: -1
          type: number
          description: Rate multiplier that should be applied to reservations. Value of 0.10 means rate multiplier of 10%.
      description: 'Allowed values for keys are: HOSTFULLY, AIRBNB, BOOKINGDOTCOM, HVMI, VRBO, GOOGLE, GETAWAY_GO_GO, GOLIGHTLY, HOMADS, NEXTPAX, RED_AWNING, RENTALS_UNITED, TRIP_ADVISOR, VACAY_MY_WAY, WHIMSTAY'
    RateMultipliersApi3Dto:
      required:
      - agencyUid
      - rateMultipliers
      type: object
      properties:
        agencyUid:
          type: string
        rateMultipliers:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/RateMultiplierApi3Dto'
          description: 'Allowed values for keys are: HOSTFULLY, AIRBNB, BOOKINGDOTCOM, HVMI, VRBO, GOOGLE, GETAWAY_GO_GO, GOLIGHTLY, HOMADS, NEXTPAX, RED_AWNING, RENTALS_UNITED, TRIP_ADVISOR, VACAY_MY_WAY, WHIMSTAY'
  securitySchemes:
    JWT-Authentication:
      type: apiKey
      description: OAuth Access Token
      name: Authorization
      in: header
    Agency-API-key:
      type: apiKey
      description: API Key
      name: X-HOSTFULLY-APIKEY
      in: header
externalDocs:
  description: Hostfully Documentation
  url: https://dev.hostfully.com/v3.0/reference
x-readme:
  explorer-enabled: true
  proxy-enabled: true
x-provenance:
  method: harvested
  publisher: Hostfully
  source: https://dev.hostfully.com/openapi/69e0c82ecbd69b36f3b38964
