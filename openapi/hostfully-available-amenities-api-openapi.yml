      tags:
      - Available Amenities
      summary: Get all available amenities
      description: Returns the list of available amenities for the given property UID
      operationId: getAll_13
      parameters:
      - name: propertyUid
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AvailableAmenitiesApiResponseWrapper'
