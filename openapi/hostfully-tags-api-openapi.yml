info:
  title: Hostfully Tags API
  license:
    name: Apache 2.0
    url: https://www.hostfully.com/
  version: v3.0.1
servers:
- url: https://sandbox-api.hostfully.com
security:
- JWT-Authentication: []
- Agency-API-key: []
tags:
- name: Tags
paths:
  /api/v3.3/tags:
    get:
      tags:
      - Tags
      summary: Get tags for object
      description: Get tags for 'objectUid' and 'objectType'.
      operationId: TagsByObject
      parameters:
      - name: objectUid
        in: query
        required: true
        schema:
          type: string
      - name: objectType
        in: query
        required: true
        schema:
          type: string
          enum:
          - LEAD
          - PROPERTY
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TagsV3ApiResponseWrapper'
      x-operation-id-source: normalized
      x-operation-id-original: Tags by object
    put:
      tags:
      - Tags
      summary: Set tags for object
      description: Sets complete tags for 'objectUid' and 'objectType'.
      operationId: SetTagsForObject
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagV3ApiRequestDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TagsV3ApiResponseWrapper'
      x-operation-id-source: normalized
      x-operation-id-original: Set tags for object
    delete:
      tags:
      - Tags
      summary: Remove tag for object
      description: Removes 'tag' for object 'objectUid' and 'objectType'.
      operationId: RemoveTagForObject
      parameters:
      - name: tag
        in: query
        required: true
        schema:
          type: string
      - name: objectUid
        in: query
        required: true
        schema:
          type: string
      - name: objectType
        in: query
        required: true
        schema:
          type: string
          enum:
          - LEAD
          - PROPERTY
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TagsV3ApiResponseWrapper'
      x-operation-id-source: normalized
      x-operation-id-original: Remove tag for object
components:
  schemas:
    TagsV3ApiResponseWrapper:
      type: object
      properties:
        tagsForObject:
          $ref: '#/components/schemas/TagV3ApiResponseDto'
    TagV3ApiRequestDto:
      required:
      - objectType
      - objectUid
      - tags
      type: object
      properties:
        objectUid:
          type: string
        objectType:
          type: string
          enum:
          - LEAD
          - PROPERTY
        tags:
          uniqueItems: true
          type: array
          items:
            type: string
        dropOtherTags:
          type: boolean
          description: If 'true', the request will remove all tags not mentioned in the tags array. Nothing will happen if 'false' or 'null'
    TagV3ApiResponseDto:
      type: object
      properties:
        objectUid:
          type: string
        objectType:
          type: string
          enum:
          - LEAD
          - PROPERTY
        tags:
          uniqueItems: true
          type: array
          items:
            type: string
  securitySchemes:
    JWT-Authentication:
      type: apiKey
      description: OAuth Access Token
      name: Authorization
      in: header
    Agency-API-key:
      type: apiKey
      description: API Key
      name: X-HOSTFULLY-APIKEY
      in: header
