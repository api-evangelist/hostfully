paths:
  /api/v3.3/tags:
    get:
      tags:
      - Tags
      summary: Get tags for object
      description: Get tags for 'objectUid' and 'objectType'.
      operationId: TagsByObject
      parameters:
      - name: objectUid
        in: query
        required: true
        schema:
          type: string
      - name: objectType
        in: query
        required: true
        schema:
          type: string
          enum:
          - LEAD
          - PROPERTY
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TagsV3ApiResponseWrapper'
      x-operation-id-source: normalized
      x-operation-id-original: Tags by object
    put:
      tags:
      - Tags
      summary: Set tags for object
      description: Sets complete tags for 'objectUid' and 'objectType'.
      operationId: SetTagsForObject
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagV3ApiRequestDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TagsV3ApiResponseWrapper'
      x-operation-id-source: normalized
      x-operation-id-original: Set tags for object
    delete:
      tags:
      - Tags
      summary: Remove tag for object
      description: Removes 'tag' for object 'objectUid' and 'objectType'.
      operationId: RemoveTagForObject
      parameters:
      - name: tag
        in: query
        required: true
        schema:
          type: string
      - name: objectUid
        in: query
        required: true
        schema:
          type: string
      - name: objectType
        in: query
        required: true
        schema:
          type: string
          enum:
          - LEAD
          - PROPERTY
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TagsV3ApiResponseWrapper'
      x-operation-id-source: normalized
      x-operation-id-original: Remove tag for object
