paths:
  /api/v3.3/rooms-bulk:
    put:
      tags:
      - Rooms Bulk
      summary: This operation adds new or updates existing property rooms.
      operationId: put_3
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomsBulkUpdatingApi3Dto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RoomBulkApiResponseWrapper'
