openapi: 3.2.0
info:
  title: Hostfully Service Providers API
  license:
    name: Apache 2.0
    url: https://www.hostfully.com/
  version: v3.0.1
servers:
- url: https://sandbox-api.hostfully.com
security:
- JWT-Authentication: []
- Agency-API-key: []
tags:
- name: Service Providers
paths:
  /api/v3.3/service-providers/{serviceProviderUid}:
    get:
      tags:
      - Service Providers
      summary: Get service provider
      description: Retrieves details of a specific service provider
      operationId: getOne_1
      parameters:
      - name: serviceProviderUid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ServiceProviderApiResponseWrapper'
    put:
      tags:
      - Service Providers
      summary: Update service provider
      description: Modifies an existing service provider's details
      operationId: put_1
      parameters:
      - name: serviceProviderUid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceProviderUpdatingApi3Dto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ServiceProviderApiResponseWrapper'
    delete:
      tags:
      - Service Providers
      summary: Delete service provider
      description: Removes a service provider from an agency
      operationId: delete_1
      parameters:
      - name: serviceProviderUid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
  /api/v3.3/service-providers:
    get:
      tags:
      - Service Providers
      summary: List service providers
      description: Retrieves all service providers for an agency
      operationId: getAll_2
      parameters:
      - name: agencyUid
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ServiceProvidersApiResponseWrapper'
    post:
      tags:
      - Service Providers
      summary: Create service provider
      description: Adds a new service provider to an agency
      operationId: post_2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceProviderAddingApi3Dto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ServiceProviderApiResponseWrapper'
