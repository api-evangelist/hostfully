paths:
  /api/v3.3/promo-codes:
    get:
      tags:
      - PromoCodes
      description: Fetches promo codes by provided filter
      operationId: getAll_15
      parameters:
      - name: propertiesUids
        in: query
        required: false
        schema:
          uniqueItems: true
          type: array
          items:
            type: string
          default: []
      - name: statuses
        in: query
        required: false
        schema:
          uniqueItems: true
          type: array
          items:
            type: string
            enum:
            - ACTIVE
            - EXPIRED
            - REDEEMED
            - DELETED
          default: []
      - name: from
        in: query
        required: false
        schema:
          type: string
          example: '2026-04-20T11:52:36'
        example: '2025-01-01T00:00:00'
      - name: to
        in: query
        required: false
        schema:
          type: string
          example: '2026-04-20T11:52:36'
        example: '2025-01-10T23:59:59'
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - SORT_BY_CODE
          - SORT_BY_STATUS
          - SORT_BY_TYPE
          - SORT_BY_VALUE
          - SORT_BY_CURRENCY
          - SORT_BY_SINGLE_USAGE
          - SORT_BY_VALID_FROM_DATE_TIME
          - SORT_BY_VALID_TO_DATE_TIME
          - SORT_BY_EXPIRATION_DATE_TIME
          - SORT_BY_CREATED_DATE
      - name: sortDirection
        in: query
        required: false
        schema:
          type: string
          enum:
          - ASC
          - DESC
      - name: _cursor
        in: query
        description: Cursor for pagination
        required: false
        schema:
          type: string
          description: Cursor for pagination
      - name: _limit
        in: query
        description: Limit for pagination
        required: false
        schema:
          type: string
          description: Limit for pagination
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoCodeResponseWrapper'
      summary: Get all 15
      x-summary-source: derived
    post:
      tags:
      - PromoCodes
      operationId: post_12
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoCodeApi3AddingDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PromoCodeApiResponseWrapper'
      summary: Post 12
      x-summary-source: derived
  /api/v3.3/promo-codes/{promoCodeUid}:
    get:
      tags:
      - PromoCodes
      operationId: getOne_9
      parameters:
      - name: promoCodeUid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PromoCodeApiResponseWrapper'
      summary: Get one 9
      x-summary-source: derived
    delete:
      tags:
      - PromoCodes
      operationId: delete_11
      parameters:
      - name: promoCodeUid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
      summary: Delete 11
      x-summary-source: derived
