openapi: 3.2.0
info:
  title: Hostfully Properties API
  license:
    name: Apache 2.0
    url: https://www.hostfully.com/
  version: v3.0.1
servers:
- url: https://sandbox-api.hostfully.com
security:
- JWT-Authentication: []
- Agency-API-key: []
tags:
- name: Properties
paths:
  /api/v3.3/properties/{propertyUid}:
    get:
      tags:
      - Properties
      summary: Get property details
      description: Retrieves detailed information about a specific property by its UID
      operationId: findByPropertyUid_1
      parameters:
      - name: propertyUid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PropertyApiV3ResponseWrapper'
    put:
      tags:
      - Properties
      summary: Full property update
      description: Presumes a full update to the property resource. All fields need to be present.
      operationId: updatePropertyInFull
      parameters:
      - name: propertyUid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertiesSavingApi3Dto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PropertyApiV3ResponseWrapper'
    delete:
      tags:
      - Properties
      summary: Delete property
      description: Removes a property by uid
      operationId: deletePropertyByUid
      parameters:
      - name: propertyUid
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
    patch:
      tags:
      - Properties
      summary: Partial property update
      description: Provides ability to partially update property resource. Not all fields need to be present
      operationId: updatePropertyPartially
      parameters:
      - name: propertyUid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertiesPatchApi3Dto'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PropertyApiV3ResponseWrapper'
  /api/v3.3/properties:
    get:
      tags:
      - Properties
      summary: List properties by agency
      description: Retrieves list of properties for an agency with optional updatedSince filter
      operationId: findByAgencyUid
      parameters:
      - name: agencyUid
        in: query
        required: true
        schema:
          type: string
      - name: updatedSince
        in: query
        required: false
        schema:
          type: string
          example: '2023-09-28T10:31:01'
        example: '2023-09-28T10:31:01'
      - name: _cursor
        in: query
        description: Cursor for pagination
        required: false
        schema:
          type: string
          description: Cursor for pagination
      - name: _limit
        in: query
        description: Limit for pagination
        required: false
        schema:
          type: string
          description: Limit for pagination
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PropertiesApiV3ResponseWrapper'
    post:
      tags:
      - Properties
      summary: Create new property
      operationId: createProperty
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertiesCreationApi3Dto'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PropertyApiV3ResponseWrapper'
