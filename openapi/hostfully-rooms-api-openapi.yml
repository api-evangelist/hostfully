openapi: 3.2.0
info:
  title: Hostfully Rooms API
  license:
    name: Apache 2.0
    url: https://www.hostfully.com/
  version: v3.0.1
servers:
- url: https://sandbox-api.hostfully.com
security:
- JWT-Authentication: []
- Agency-API-key: []
tags:
- name: Rooms
paths:
  /api/v3.3/rooms/{roomUid}:
    get:
      tags:
      - Rooms
      summary: Get room details
      description: Retrieves details of a specific room
      operationId: getOne_2
      parameters:
      - name: roomUid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RoomApiResponseWrapper'
    put:
      tags:
      - Rooms
      summary: Update room
      description: Modifies an existing room's details
      operationId: put_2
      parameters:
      - name: roomUid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomApi3UpdatingDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RoomApiResponseWrapper'
    delete:
      tags:
      - Rooms
      summary: Delete room
      description: Removes a room from a property
      operationId: delete_2
      parameters:
      - name: roomUid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
  /api/v3.3/rooms:
    get:
      tags:
      - Rooms
      summary: List property rooms
      description: Retrieves all rooms for a property
      operationId: getAll_3
      parameters:
      - name: propertyUid
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RoomsApiResponseWrapper'
    post:
      tags:
      - Rooms
      summary: Create room
      description: Adds a new room to a property
      operationId: post_3
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomApi3AddingDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RoomApiResponseWrapper'
