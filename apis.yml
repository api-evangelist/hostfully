apis:
- aid: hostfully:hostfully-rest-api
  name: Hostfully REST API
  description: >-
    Hostfully Property Management Platform REST API v3.x covering properties (single and multi-unit),
    leads (inquiries, booking requests, bookings, group bookings, holds, cancellations, rebooking), orders
    and order adjustments, owner adjustments, fees, photos and descriptions, amenities and rules, employees
    and owners, guests, reviews, jobs and tasks, messaging (threads, channel messages, resend), custom
    data fields, agencies, iCal exports, DBS (Direct Booking System) settings, and webhook subscriptions.
    Supports OAuth 2.0 Authorization Code Flow for partners, Basic Auth for token exchange, and X-HOSTFULLY-APIKEY
    header for direct account access. Rate-limited to 10,000 calls per hour per client; uses cursor-based
    pagination. Sandbox and production environments available.
  humanURL: https://dev.hostfully.com/reference/getting-started
  tags:
