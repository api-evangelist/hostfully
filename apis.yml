aid: hostfully

name: Hostfully

description: Hostfully is a San Francisco-based short-term rental (STR) property management platform serving vacation rental managers, property
  managers, and hospitality operators worldwide. The Hostfully Property Management Platform (PMP) provides a channel manager that syncs listings
  across 60+ booking channels including Airbnb, Vrbo, and Booking.com (where Hostfully holds preferred/elite partner status), a central calendar,
  unified inbox with InboxAI for guest communication, direct booking site builder, automation and task management, multi-unit and group-booking
  management, payment processing via Stripe/PayPal/VRP, owner portal, mobile apps for iOS and Android, and digital guidebooks. The platform manages
  62,000+ properties for 40,000+ customers, processing 96,000+ bookings monthly. Hostfully exposes a developer-grade public REST API (v3.3) and
  a GraphQL API for partners and property managers, supporting OAuth 2.0 authorization-code, basic auth, and X-HOSTFULLY-APIKEY authentication,
  cursor-based pagination, webhooks for agency/booking/property/messaging/custom-data events, and a 10,000 calls/hour per-client rate limit. The
  API is offered as an add-on across the Growth, Pro, and Enterprise Property Management Software plans.

